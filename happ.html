<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Movin → Happ</title>
<style>
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif}
.w{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;box-sizing:border-box;text-align:center}
.m{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#5B8CFF,#3D7BFF);display:grid;place-items:center;box-shadow:0 0 40px rgba(61,123,255,.45)}
.m svg{width:30px;height:30px}
h1{font-size:22px;margin:6px 0 0}
p{margin:0;color:#8E8E93;font-size:15px;line-height:1.45;max-width:320px}
a.b{display:block;width:100%;max-width:340px;padding:16px;border-radius:16px;background:#3D7BFF;color:#fff;font-weight:700;font-size:17px;text-decoration:none;margin-top:10px}
a.s{display:block;width:100%;max-width:340px;padding:14px;border-radius:16px;background:#1C1C1E;color:#fff;font-weight:600;font-size:15px;text-decoration:none}
small{color:#5A5A5F;font-size:13px;max-width:320px;line-height:1.4}
</style>
</head>
<body>
<div class="w">
  <div class="m"><svg viewBox="0 0 24 24" fill="none"><path d="M4 18V6l8 7 8-7v12" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <h1>Открываем Happ…</h1>
  <p>Подписка Movin добавится автоматически. Если ничего не произошло — нажмите кнопку.</p>
  <a class="b" id="open" href="#">Открыть в Happ</a>
  <a class="s" href="https://www.happ.su/" target="_blank" rel="noopener">У меня нет Happ — установить</a>
  <small>После установки вернитесь в Telegram и снова нажмите «Подключить в Happ».</small>
</div>
<script>
(function(){
  var sub = decodeURIComponent((location.hash||'').slice(1));
  var btn = document.getElementById('open');
  if (!/^https:\/\//.test(sub)){ document.querySelector('h1').textContent='Ссылка не найдена'; document.querySelector('p').textContent='Вернитесь в Movin и нажмите «Подключить в Happ» ещё раз.'; btn.style.display='none'; return; }
  var link = 'happ://add/' + sub;
  btn.href = link;
  setTimeout(function(){ location.href = link; }, 300);
})();
</script>
</body>
</html>
