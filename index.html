<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Movin</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif}
.w{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.m{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#5B8CFF,#3D7BFF);display:grid;place-items:center;box-shadow:0 0 40px rgba(61,123,255,.45);animation:p 1.4s ease-in-out infinite}
.m svg{width:30px;height:30px}
.t{font-size:14px;font-weight:600;color:#8E8E93;text-align:center;padding:0 24px;line-height:1.4}
.b{display:none;margin-top:4px;padding:12px 22px;border-radius:14px;background:#3D7BFF;color:#fff;font-weight:700;font-size:15px;border:0}
@keyframes p{50%{transform:scale(.92);opacity:.75}}
</style>
</head>
<body>
<div class="w">
  <div class="m"><svg viewBox="0 0 24 24" fill="none"><path d="M4 18V6l8 7 8-7v12" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="t" id="t">Загружаем Movin…</div>
  <button class="b" id="b" onclick="location.reload()">Повторить</button>
</div>
<script>
(function(){
  /* Load the app from whichever route works for this user:
     via the Russian server (users in Russia without VPN) or directly (users with VPN / abroad). */
  var S = [
    {u:'https://app.getmovin.net/app/main.html', api:'https://app.getmovin.net/miniapp'},
    {u:'https://bot.getmovin.net/app/main.html', api:'https://bot.getmovin.net/miniapp'}
  ];
  var done=false, fails=0, v='?v='+Date.now();
  function fail(){ if(done) return; document.getElementById('t').textContent='Не удалось загрузить. Проверьте интернет и попробуйте ещё раз.'; document.getElementById('b').style.display='inline-block'; }
  function go(html, api){
    if(done) return; done=true;
    html = html.replace('<head>', '<head><script>window.__MOVIN_API='+JSON.stringify(api)+'<\/script>');
    document.open(); document.write(html); document.close();
  }
  S.forEach(function(s){
    fetch(s.u+v, {cache:'no-store'}).then(function(r){ if(!r.ok) throw 0; return r.text(); })
      .then(function(t){ if(t.indexOf('MOVIN_APP_OK')<0) throw 0; go(t, s.api); })
      .catch(function(){ if(++fails===S.length) fail(); });
  });
  setTimeout(fail, 25000);
})();
</script>
</body>
</html>
